<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 420" width="1180" height="420" role="img" aria-label="Work Projects Grid">
  <defs>
    <linearGradient id="proj-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#143B35" />
      <stop offset="50%" stop-color="#00F5C4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#143B35" />
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
